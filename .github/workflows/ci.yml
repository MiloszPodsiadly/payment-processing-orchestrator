name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - PPO-*

permissions:
  contents: read

jobs:
  build:
    name: Build and quality gates
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Compile
        run: sbt "clean; compile"

      - name: Formatting
        run: sbt "scalafmtSbtCheck; scalafmtCheckAll"

      - name: Static analysis
        run: sbt "scalafixAll --check"

      - name: Fast tests
        run: sbt test

      - name: Architecture checks
        run: sbt verifyArchitecture

      - name: Integration-test compile
        run: sbt integrationTests/Test/compile
