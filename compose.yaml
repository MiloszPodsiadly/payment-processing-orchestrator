services:
  cassandra:
    image: cassandra:5.0.8
    container_name: payment-orchestrator-cassandra
    restart: unless-stopped
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: payment-orchestrator-local
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_NUM_TOKENS: "16"
      HEAP_NEWSIZE: 128M
      MAX_HEAP_SIZE: 512M
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh 127.0.0.1 9042 -e 'DESCRIBE KEYSPACES'"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 60s

  cassandra-migrate:
    image: cassandra:5.0.8
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./modules/adapter-cassandra/src/main/resources/db/cassandra/migrations:/migrations:ro
    command:
      - /bin/bash
      - -lc
      - |
        cqlsh cassandra 9042 -f /migrations/V001__pekko_persistence_journal.cql

volumes:
  cassandra-data:

