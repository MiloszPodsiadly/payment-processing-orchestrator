payment {
  application {
    name = "payment-processing-orchestrator"
    environment = ${?PAYMENT_ENVIRONMENT}
  }

  http {
    interface = "0.0.0.0"
    interface = ${?PAYMENT_HTTP_INTERFACE}
    port = 8080
    port = ${?PAYMENT_HTTP_PORT}
  }

  cassandra {
    host = "127.0.0.1"
    host = ${?PAYMENT_CASSANDRA_HOST}
    port = 9042
    port = ${?PAYMENT_CASSANDRA_PORT}
    local-datacenter = "datacenter1"
    local-datacenter = ${?PAYMENT_CASSANDRA_LOCAL_DATACENTER}
    keyspace = "pekko"
    keyspace = ${?PAYMENT_CASSANDRA_KEYSPACE}
  }

  security {
    token-issuer = "local-dev-issuer"
    token-issuer = ${?PAYMENT_SECURITY_TOKEN_ISSUER}
  }

  observability {
    structured-logging = true
    structured-logging = ${?PAYMENT_OBSERVABILITY_STRUCTURED_LOGGING}
  }

  provider {
    mode = "mock"
    mode = ${?PAYMENT_PROVIDER_MODE}
  }
}

pekko.persistence.journal.plugin = "pekko.persistence.cassandra.journal"

pekko.persistence.cassandra {
  coordinated-shutdown-on-error = on

  journal {
    keyspace = ${payment.cassandra.keyspace}
    keyspace-autocreate = false
    tables-autocreate = false
    target-partition-size = 500000
    support-deletes = off
  }
}

datastax-java-driver {
  basic.contact-points = [${payment.cassandra.host}":"${payment.cassandra.port}]
  basic.load-balancing-policy.local-datacenter = ${payment.cassandra.local-datacenter}
  advanced.reconnect-on-init = true

  profiles {
    pekko-persistence-cassandra-profile {
      basic.request {
        consistency = QUORUM
        default-idempotence = true
        timeout = 5 seconds
      }
    }
  }
}
