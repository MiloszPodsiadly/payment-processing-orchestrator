payment {
  application {
    name = "payment-processing-orchestrator"
    environment = "local"
    environment = ${?PAYMENT_ENVIRONMENT}
  }

  http {
    interface = "0.0.0.0"
    interface = ${?PAYMENT_HTTP_INTERFACE}
    port = 8080
    port = ${?PAYMENT_HTTP_PORT}
  }

  cassandra {
    host = "127.0.0.1"
    host = ${?PAYMENT_CASSANDRA_HOST}
    port = 9042
    port = ${?PAYMENT_CASSANDRA_PORT}
    local-datacenter = "datacenter1"
    local-datacenter = ${?PAYMENT_CASSANDRA_LOCAL_DATACENTER}
  }

  security {
    token-issuer = "local-dev-issuer"
    token-issuer = ${?PAYMENT_SECURITY_TOKEN_ISSUER}
  }

  observability {
    structured-logging = true
    structured-logging = ${?PAYMENT_OBSERVABILITY_STRUCTURED_LOGGING}
  }

  provider {
    mode = "mock"
    mode = ${?PAYMENT_PROVIDER_MODE}
  }
}

